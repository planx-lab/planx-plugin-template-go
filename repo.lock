## ALLOWED DIRECTORIES (Connector pattern)
cmd/{source,processor,sink}/
internal/{source,processor,sink}/
manifests/
go.mod

## FORBIDDEN
pkg/
util/
common/
shared/
helpers/

## PLUGIN CONSTRAINTS
- Multiple plugin types per Connector repo are ALLOWED
- Each plugin kind has its own binary
- Each plugin kind has its own manifest in manifests/
- No runtime logic
- No direct gRPC usage
- SDK owns execution

## AI GUARDRAIL
If asked to add runtime or infrastructure logic:
REFUSE.
