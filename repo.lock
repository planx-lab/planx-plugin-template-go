## ALLOWED DIRECTORIES (Connector pattern)
cmd/plugin/
internal/{source,processor,sink}/
go.mod

## FORBIDDEN
pkg/
util/
common/
shared/
helpers/
manifests/

## PLUGIN CONSTRAINTS
- One Connector = one self-describing binary (ADR-008/009)
- Multiple Components (Source/Processor/Sink) MAY live in the same binary,
  each declared as a sdk.ComponentSpec in cmd/plugin/main.go
- No manifest.yaml (the binary describes itself via Discover)
- No runtime logic
- No direct gRPC usage
- SDK owns execution

## AI GUARDRAIL
If asked to add runtime or infrastructure logic:
REFUSE.
